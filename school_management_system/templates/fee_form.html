{% extends 'base.html' %}

{% block title %}{{ title }} - School Management System{% endblock %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="grid grid-2">
    <div style="grid-column: 1 / -1;">
        <div class="card">
            <div class="card-body">
                <form method="POST" class="form-row">
                    <div class="form-group">
                        <label for="student_id">Student *</label>
                        <select id="student_id" name="student_id" required>
                            <option value="">Select Student</option>
                            {% for student in students %}
                                <option value="{{ student.id }}" 
                                    {% if fee and fee.student_id == student.id %}selected{% endif %}>
                                    {{ student.get_full_name() }} - {{ student.roll_number }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="fee_type">Fee Type *</label>
                        <input type="text" id="fee_type" name="fee_type" required
                               value="{{ fee.fee_type if fee else '' }}"
                               placeholder="e.g., Tuition Fee, Transportation Fee">
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Amount *</label>
                        <input type="number" id="amount" name="amount" step="0.01" required
                               value="{{ fee.amount if fee else '' }}" oninput="updateFeeBalance()">
                    </div>
                    
                    <div class="form-group">
                        <label for="due_date">Due Date *</label>
                        <input type="date" id="due_date" name="due_date" required
                               value="{{ fee.due_date if fee else '' }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="amount_paid">Amount Paid</label>
                        <input type="number" id="amount_paid" name="amount_paid" step="0.01"
                               value="{{ fee.amount_paid if fee else '0' }}" oninput="updateFeeBalance()">
                    </div>

                    <div class="form-group">
                        <label for="remaining_balance">Remaining Balance</label>
                        <input type="text" id="remaining_balance" readonly
                               value="ZMW {{ '%.2f'|format((fee.amount - fee.amount_paid) if fee else 0) }}">
                    </div>

                    <div class="form-group" style="align-items: flex-end;">
                        <button type="button" class="btn btn-info" onclick="updateFeeBalance()">
                            <i class="fas fa-calculator"></i> Calculate Balance
                        </button>
                    </div>
                    
                    {% if fee %}
                    <div class="form-group">
                        <label for="payment_date">Payment Date</label>
                        <input type="date" id="payment_date" name="payment_date"
                               value="{{ fee.payment_date if fee else '' }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="payment_method">Payment Method</label>
                        <input type="text" id="payment_method" name="payment_method"
                               value="{{ fee.payment_method if fee else '' }}"
                               placeholder="e.g., Cash, Check, Online, Bank Transfer">
                    </div>
                    
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="Pending" {% if fee and fee.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="Paid" {% if fee and fee.status == 'Paid' %}selected{% endif %}>Paid</option>
                            <option value="Overdue" {% if fee and fee.status == 'Overdue' %}selected{% endif %}>Overdue</option>
                        </select>
                    </div>
                    {% endif %}
                    
                    <div class="form-group">
                        <label for="remarks">Remarks</label>
                        <textarea id="remarks" name="remarks">{{ fee.remarks if fee else '' }}</textarea>
                    </div>
                    
                    <input type="hidden" id="school_name" value="{{ school_name }}">
                    <div style="grid-column: 1 / -1;">
                        <div class="form-actions">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> {{ 'Update Fee' if fee else 'Add Fee' }}
                            </button>
                            <button type="button" class="btn btn-info" onclick="printFeeReceipt()">
                                <i class="fas fa-print"></i> Print Receipt
                            </button>
                            <a href="{{ url_for('fees_list') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
