{% extends 'base.html' %}

{% block title %}{{ title }} - School Management System{% endblock %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="grid grid-2">
    <div style="grid-column: 1 / -1;">
        <div class="card">
            <div class="card-body">
                <form method="POST" class="form-row">
                    <div class="form-group">
                        <label for="student_id">Student *</label>
                        <select id="student_id" name="student_id" required>
                            <option value="">Select Student</option>
                            {% for student in students %}
                                <option value="{{ student.id }}" 
                                    {% if grade and grade.student_id == student.id %}selected{% endif %}>
                                    {{ student.get_full_name() }} - {{ student.roll_number }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="teacher_id">Teacher *</label>
                        <select id="teacher_id" name="teacher_id" required>
                            <option value="">Select Teacher</option>
                            {% for teacher in teachers %}
                                <option value="{{ teacher.id }}" 
                                    {% if grade and grade.teacher_id == teacher.id %}selected{% endif %}>
                                    {{ teacher.get_full_name() }} - {{ teacher.employee_id }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject" name="subject" required
                               value="{{ grade.subject if grade else '' }}"
                               placeholder="e.g., Mathematics, Science">
                    </div>
                    
                    <div class="form-group">
                        <label for="exam_name">Exam Name</label>
                        <input type="text" id="exam_name" name="exam_name"
                               value="{{ grade.exam_name if grade else '' }}"
                               placeholder="e.g., Mid Term, Final Exam">
                    </div>
                    
                    <div class="form-group">
                        <label for="marks">Marks Obtained *</label>
                        <input type="number" id="marks" name="marks" step="0.01" required
                               value="{{ grade.marks if grade else '' }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="total_marks">Total Marks</label>
                        <input type="number" id="total_marks" name="total_marks" step="0.01" value="{{ grade.total_marks if grade else '100' }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="remarks">Remarks</label>
                        <textarea id="remarks" name="remarks">{{ grade.remarks if grade else '' }}</textarea>
                    </div>
                    
                    <div style="grid-column: 1 / -1;">
                        <div class="form-actions">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> {{ 'Update Grade' if grade else 'Add Grade' }}
                            </button>
                            {% if grade %}
                                <a href="{{ url_for('grade_summary', grade_id=grade.id) }}" class="btn btn-primary" target="_blank">
                                    <i class="fas fa-print"></i> Print Summary
                                </a>
                            {% endif %}
                            <a href="{{ url_for('grades_list') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
