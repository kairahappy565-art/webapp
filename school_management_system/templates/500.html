{% extends 'base.html' %}

{% block title %}Server Error - School Management System{% endblock %}

{% block page_title %}500 - Server Error{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 500px;">
    <div style="text-align: center;">
        <div style="font-size: 100px; font-weight: 700; color: var(--danger-color); margin-bottom: 20px;">
            500
        </div>
        <h2 style="font-size: 28px; color: var(--text-dark); margin-bottom: 10px;">
            Server Error
        </h2>
        <p class="text-muted" style="margin-bottom: 30px; font-size: 16px;">
            Something went wrong on our end. Please try again later.
        </p>
        <div style="display: flex; gap: 15px; justify-content: center;">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                <i class="fas fa-home"></i> Go to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </div>
    </div>
</div>

{% endblock %}
